author: "dwasint"
delete-after: True
changes:
  - rscdel: "player attunements"
  - rscdel: "spell attunements"
  - rscadd: "spell forms and techniques, spells are now split into a form and an optional technique"
  - rscadd: "bookcrafting system, now books can take more then a catalyst and doing so provides buffs for all spells"
  - refactor: "spells learned from your spellbook are now only kept if you are holding the spellbook."
  - rscadd: "spellsword and spellfist spells"
  - rscadd: "100 new impact spells"
  - rscadd: "40 new cantrip spells"
  - refactor: "lightning spells no longer hard stun constantly"
  - rscadd: "arcyne necromancy"
  - refactor: "summoning, it now has a downside where when your summons die you experience backlash preventing resummon"
  - rscadd: "sorcerer framework, unlike mages sorcerers cannot learn spells from a spellbook in exchange for more innate points"
  - rscadd: "spellbook granted spells now have a limited number of charges, to replenish you need to use the rune of recharge."
  - rscdel: "attunement matrix"
  - refactor: "spell cost, spell cast speed, and spell strength are now public information on your equipment so its not impossible to tell what is giving you buffs, and is no longer mutated by the spell you are casting"
  - qol: "you can now examine spells with shift click to get name and desc"