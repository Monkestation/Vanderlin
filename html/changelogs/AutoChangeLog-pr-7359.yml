author: "realforest2001"
delete-after: True
changes:
  - refactor: "Refactors how scrying is attached to objects."
  - rscadd: "You can now still hear your personal surroundings and speak to people around you whilst scrying."
  - rscdel: "Black Mirror no longer asks if you want to locate the person who's blood it contains."
  - rscadd: "Scrying Orb can now only be used by people with Arcyne magic skill."
  - rscadd: "NOC Device no longer requires the target to be alive. You still need to know them."
  - rscadd: "Bog Witch now spawns with an Eye of the Hunt, a scrying eye that is patron locked to the Proven Hunt."
  - rscdel: "Temporarily disables the free-form spying eye the Vampire Lord gets."