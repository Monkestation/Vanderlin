author: "realforest2001"
delete-after: True
changes:
  - rscadd: "Added a special key for the Butler, providing them with wider access around the keep, namely access to all the bedrooms."
  - rscadd: "Gave the Hand the same key."
  - rscadd: "Added individual keys for each guest room in the keep."
  - rscadd: "Added keys for Servants and the Heirs, restricting their areas from generic keep access."
  - rscadd: "Restricted the wine cellar to Servants, Butler and Consort."
  - rscadd: "Added some library keys for the archivist to give out to trusted people. Does not provide access to archivist quarters."
  - rscadd: "Changed the Consort's key to be wide reaching but not a master key."
  - rscadd: "Monarch now spawns with a keyring and some spare keys so they're not screwed if they lend out the master key."
  - rscadd: "Butler key can now open the death pit."
  - rscadd: "Added a key to the keep for the noble role."
  - image: "Added three new key icons, two taken from Azure Peak."
  - code_imp: "Changed lock difficulties to defines instead of magic numbers."