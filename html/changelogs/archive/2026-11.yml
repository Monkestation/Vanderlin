  ta3754859-max:
  - bugfix: Werewolf being unable to spread lycanthrophy
  - qol: Re-added gathering materials for carts from the spot the user is standing
      on
  - qol: Switched dumping handcart's contents to alt+click
  - qol: Added controls under the mechanics tab when examining the handcart
