  - map: "Changed the tavern's first floor\n<!-- Both :cl:'s are required for the changelog to work! You can put your name to the right of the first :cl: if you want to overwrite your GitHub username as author ingame. -->\n<!-- You can use multiple of the same prefix (they're only used for the icon ingame) and delete the unneeded ones. Despite some of the tags, changelogs should generally represent how a player might be affected by the changes rather than a summary of the PR's contents. -->\n## Pre-Merge Checklist\n<!-- Don't bother filling these in while creating your Pull Request, just click the checkboxes after the Pull Request is opened and you are redirected to the page. -->\n- [x] You tested this on a local server.\n- [x] This code did not runtime during testing.\n- [x] You documented all of your changes.\n<!-- Neither the compiler nor workflow checks are perfect at detecting runtimes and errors. It is important to test your code/feature/fix locally. -->\n<img width=\"1120\" height=\"697\" alt=\"image\" src=\"https://github.com/user-attachments/assets/f8328fb3-7f8c-455b-96a0-256839d6052f\" />\n<img width=\"1146\" height=\"802\" alt=\"image\" src=\"https://github.com/user-attachments/assets/92c51956-0838-4521-8441-164d80b6354a\" />"